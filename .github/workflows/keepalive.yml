name: Supabase Keepalive

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable workflow (resets GitHub's 60-day inactivity timer)
        run: gh workflow enable keepalive.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Write keepalive timestamp
        run: |
          curl -sf -X PATCH \
            -H "apikey: sb_publishable_g6xudK0xCihfdQi5t-AbgA_XqqtexPN" \
            -H "Authorization: Bearer sb_publishable_g6xudK0xCihfdQi5t-AbgA_XqqtexPN" \
            -H "Content-Type: application/json" \
            -d "{\"pinged_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
            "https://wzzvahevprmwigtiriyr.supabase.co/rest/v1/keepalive?id=eq.1"
