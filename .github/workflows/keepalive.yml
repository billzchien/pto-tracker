name: Supabase Keepalive

on:
  schedule:
    # Off-peak minute — the :00 slots are congested and runs get delayed/dropped.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable workflow (resets GitHub's 60-day inactivity timer)
        run: gh workflow enable keepalive.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Write keepalive timestamp
        env:
          KEY: sb_publishable_g6xudK0xCihfdQi5t-AbgA_XqqtexPN
          URL: https://wzzvahevprmwigtiriyr.supabase.co/rest/v1/keepalive?id=eq.1
        run: |
          # Retry transient failures (5xx, timeouts, connection resets) with backoff
          # before giving up. --retry-all-errors covers HTTP errors, not just network ones.
          status=$(curl -s -o body.txt -D headers.txt -w '%{http_code}' \
            --retry 6 --retry-delay 15 --retry-all-errors --max-time 30 \
            -X PATCH \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: count=exact" \
            -d "{\"pinged_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
            "$URL")
          echo "HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Supabase returned HTTP $status after retries"
            cat body.txt; echo
            exit 1
          fi
          rows=$(grep -i '^content-range:' headers.txt | sed 's/.*\///' | tr -d '[:space:]')
          echo "Rows updated: ${rows:-unknown}"
          if [ "$rows" = "0" ]; then
            echo "::warning::PATCH matched 0 rows — the keepalive row is hidden by RLS or missing, so this is not a real write. Seed id=1 and add an anon UPDATE policy on public.keepalive."
          fi
